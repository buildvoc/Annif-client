version: '3'

services:
  pocket-app:
    image: latifulanwar/pocketflow-tutorial-codebase-knowledge
    expose:
      - "8501"
    volumes:
      - output:/app/output
      - ./logs:/app/logs
      - ./llm_cache.json:/app/llm_cache.json
      - ./input:/app/input
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      # - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - pocket-app
    restart: unless-stopped
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"
    networks:
      - app-network

volumes:
  output:
    driver: local
    
networks:
  app-network:
    driver: bridge
    